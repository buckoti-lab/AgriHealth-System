<title>History Page</title>

<!-- <link rel="stylesheet" href="css/history.css"> -->

<div class="container mt-4">

<h3 class="text-center mb-3">HISTORY PREDICTIONS PAGE</h3>

<!-- SEARCH + FILTER -->
<div class="d-flex mb-3">
    <input type="text" id="searchInput" class="form-control me-2" placeholder="search by disease or crop...">
    
    <select id="filterSelect" class="form-select" style="max-width:200px;">
        <option value="">All Time</option>
        <option value="1_day">Last 24 Hours</option>
        <option value="7_days">Last 7 Days</option>
        <option value="30_days">Last 30 Days</option>
        <option value="90_days">Last 90 Days</option>
        <option value="365_days">Last Year</option>
</select>
</div>

<!-- TABLE -->
<table class="table table-bordered table-hover text-center">
    <thead class="table-primary">
        <tr>
            <th>Image</th>
            <th>Vegetable</th>
            <th>Disease</th>
            <th>Treatment</th>
            <th>Action</th>
            <th>Time</th>
        </tr>
    </thead>
    <tbody id="historyTable"></tbody>
</table>

<p class="text-light">Showing <span id="count">0</span> results</p>

</div>

<!-- HISTORY VIEW TREATMENTS MODAL -->
<div class="modal fade" id="viewTreatsModal">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">Recommendations details</h5>
                <button class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">
                <h6>Recommendations</h6>
                <ul id="historyTreatments"></ul>
            </div>

        </div>
    </div>
</div>


<!-- HISTORY IMAGE VIEW MODAL -->
<div class="modal fade" id="viewImageModal">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">Image preview</h5>
                <button class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">
                <img id="modalImage" class="img-fluid mb-3"/>
            </div>

        </div>
    </div>
</div>

<script src="js/history.js"></script>

</body>
</html>
