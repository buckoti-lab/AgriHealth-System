<title>Profile Page</title>

<link rel="stylesheet" href="./css/profile.css">

<div class="container mt-4">

    <h3 class="text-center mb-3">My Profile</h3>

    <div class="col-md-6">
        <div class="card p-4 result-box">
            <h5 class="text-center">My profile</h5>

            <p><strong>Email:</strong> <span id="email">-</span></p>
            <p><strong>Username:</strong> <span id="username">-</span></p>
        </div>
    </div>

    <button type="submit" class="btn btn-primary mt-3 w-5" id="editBtn" data-id="">Edit</button>
</div>

<!-- EDIT PROFILE VIEW MODAL -->
<div class="modal fade" id="EditProfileModal">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">Edit profile</h5>
                <button class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">
                <form id="editprofileForm">
                    
                    <input type="hidden" id="editId" name="id">
                    <input type="email" name="email" id="editEmail" class="form-control mb-2" placeholder="Email name" required>
                    <input type="text" name="username" id="editUsername" class="form-control mb-2" placeholder="username" required>

                    <button type="submit" class="btn btn-primary mt-3 w-5" id="saveBtn">Save</button>

                </form>

            </div>

        </div>
    </div>
</div>

<script src="./js/profile.js"></script>
