<title>History Page</title>

<link rel="stylesheet" href="css/profile.css">

<div class="container mt-4">

    <h3 class="text-center mb-3">My Profile</h3>

    <table>
        <tbody>
            <tr>
              <td style="padding: 8px; font-weight: bold;">Email</td>
              <td style="padding: 8px;" id="ViewEmail"></td>
            </tr>
            <tr>
              <td style="padding: 8px; font-weight: bold;">Username</td>
              <td style="padding: 8px;" id="ViewUsername"></td>
            </tr>
        </tbody>
    </table>

    <button onclick="openEditModal()">
</div>

<!-- EDIT PROFILE VIEW MODAL -->
<div class="modal fade" id="EditProfileModal">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">Edit profile</h5>
                <button class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">
                <form id="editprofileForm">

                    <input type="email" name="email" class="form-control mb-2" placeholder="Email name" required>
                    <input type="text" name="username" class="form-control mb-2" placeholder="username" required>

                    <input type="submit" value="Update">

                </form>

            </div>

        </div>
    </div>
</div>

<script src="js/profile.js"></script>

</body>
</html>
